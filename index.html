<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>刷题模拟器 · Servlet / 计组期末</title>
<meta name="description" content="科目刷题：Servlet 考点 + 计组期末真题单选；全真计时模拟、错题歼灭、背题速览、战况统计">
<style>
  :root { color-scheme: light dark; }
  :root {
    --background:#f6f7f9; --foreground:#1a1d21;
    --card:#ffffff; --card-foreground:#1a1d21;
    --muted:#eceef1; --muted-foreground:#5c6470; --border:#d8dce2;
    --primary:#1f2937; --primary-foreground:#ffffff;
    --green:#1a9c6b; --red:#d64545;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --background:#15171b; --foreground:#e8eaee;
      --card:#1e2126; --card-foreground:#e8eaee;
      --muted:#2a2e35; --muted-foreground:#a2aab6; --border:#343941;
      --primary:#e8eaee; --primary-foreground:#15171b;
      --green:#3ecf8e; --red:#f87171;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin:0; padding:20px 16px 40px;
    background:var(--background); color:var(--foreground);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    font-size:14px; line-height:1.5;
    -webkit-text-size-adjust:100%;
  }
  @media (max-width: 480px) {
    body { padding: 20px 10px calc(env(safe-area-inset-bottom, 0px) + 28px); }
  }
  h1,h2,h3 { line-height:1.3; margin:0; }
  .card { background:var(--card); color:var(--card-foreground); border:1px solid var(--border); border-radius:12px; }
  .btn {
    display:inline-flex; align-items:center; justify-content:center; gap:8px;
    min-height:32px; padding:4px 14px; border-radius:8px;
    border:1px solid var(--border); background:var(--card); color:var(--foreground);
    font:inherit; cursor:pointer; text-decoration:none;
  }
  .btn:hover { border-color:var(--muted-foreground); }
  .btn-primary { background:var(--primary); color:var(--primary-foreground); border-color:transparent; }
  .btn-primary:hover { opacity:.9; border-color:transparent; }
  .btn-ghost { background:transparent; border-color:transparent; }
  .btn-ghost:hover { border-color:var(--border); }
  .progress { display:flex; height:8px; border-radius:999px; background:var(--muted); overflow:hidden; }
  .progress-bar { height:100%; background:var(--primary); border-radius:999px; transition:width .15s linear; }
  .viz-badge { display:inline-block; padding:2px 10px; border-radius:999px; font-size:12px; background:var(--muted); color:var(--foreground); }
  .viz-row { display:flex; flex-wrap:wrap; align-items:center; gap:10px; }
  .text-small { font-size:12px; }
  .tabular-nums { font-variant-numeric:tabular-nums; }
  [data-lucide] { display:inline-block; width:16px; height:16px; font-style:normal; line-height:1; overflow:hidden; }
  [data-lucide="timer"]::before { content:"\23F1\FE0F"; }
  [data-lucide="alarm-clock"]::before { content:"\23F0\FE0F"; }
</style>
<script>
  window.zcode = (function () {
    var KEY = 'sq-quiz-state-v1';
    function load() {
      try { return JSON.parse(localStorage.getItem(KEY) || 'null'); }
      catch (e) { return null; }
    }
    return {
      get widgetState() { return load(); },
      setWidgetState: function (p) {
        try { localStorage.setItem(KEY, JSON.stringify(p || null)); } catch (e) {}
        return Promise.resolve(true);
      }
    };
  })();
</script>
<meta name="theme-color" content="#1f2937">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="小测模拟">
</head>
<body>
<div id="servlet-quiz-app">

  <style>
    #servlet-quiz-app { max-width: 720px; margin: 0 auto; }
    #servlet-quiz-app [hidden] { display: none !important; }
    #servlet-quiz-app .sq-title { font-weight: 500; margin-bottom: 4px; }
    #servlet-quiz-app .sq-subtitle { color: var(--muted-foreground); }
    #servlet-quiz-app .sq-options { display: flex; flex-direction: column; gap: 10px; margin-top: auto; padding-top: 20px; }
    /* 答题页纵向弹性布局：题卡在上，选项推到屏幕中下部 */
    #servlet-quiz-app #sq-quiz { display: flex; flex-direction: column; min-height: 76vh; min-height: calc(100dvh - 130px); }
    #servlet-quiz-app .sq-topbar { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 10px; }
    #servlet-quiz-app .sq-topbar-title { font-weight: 500; }
    #servlet-quiz-app .sq-timeline { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
    #servlet-quiz-app .sq-qhead { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 8px; }
    #servlet-quiz-app .sq-optcard {
      display: flex; align-items: flex-start; gap: 10px; width: 100%; text-align: left;
      border: 1px solid var(--border); border-radius: 12px; background: var(--card); color: var(--foreground);
      padding: 12px 14px; font: inherit; cursor: pointer; min-height: 48px; line-height: 1.45; white-space: normal;
    }
    #servlet-quiz-app .sq-optcard:hover { border-color: var(--muted-foreground); }
    #servlet-quiz-app .sq-optcard:disabled { cursor: default; }
    #servlet-quiz-app .sq-optcard:disabled:not(.is-correct):not(.is-wrong) { opacity: .55; }
    #servlet-quiz-app .sq-optcard.is-correct { border-color: var(--green); box-shadow: inset 0 0 0 1px var(--green); }
    #servlet-quiz-app .sq-optcard.is-wrong { border-color: var(--red); box-shadow: inset 0 0 0 1px var(--red); }
    #servlet-quiz-app .opt-key { flex: none; width: 26px; height: 26px; margin-top: 1px; border-radius: 999px; border: 1px solid var(--border); display: inline-flex; align-items: center; justify-content: center; font-size: 13px; color: var(--muted-foreground); }
    #servlet-quiz-app .opt-text { flex: 1; }
    #servlet-quiz-app .sq-optcard.is-correct .opt-key { border-color: var(--green); color: var(--green); }
    #servlet-quiz-app .sq-optcard.is-wrong .opt-key { border-color: var(--red); color: var(--red); }
    /* 选项状态色由 .sq-optcard 规则提供 */
    #servlet-quiz-app .sq-timer-num { font-size: 20px; font-weight: 500; font-variant-numeric: tabular-nums; }
    #servlet-quiz-app .sq-timer-num.low { color: var(--red); }
    #servlet-quiz-app .sq-feedback { margin-top: 12px; border-radius: 8px; padding: 10px 12px; }
    #servlet-quiz-app .sq-feedback.ok { background: color-mix(in srgb, var(--green) 12%, transparent); }
    #servlet-quiz-app .sq-feedback.bad { background: color-mix(in srgb, var(--red) 10%, transparent); }
    #servlet-quiz-app .sq-wrong-item { padding: 10px 0; border-top: 1px solid var(--border); }
    #servlet-quiz-app .sq-wrong-item:first-of-type { border-top: none; }
    #servlet-quiz-app .sq-score-big { font-size: 40px; font-weight: 500; font-variant-numeric: tabular-nums; line-height: 1.15; }
    /* 首页 hero */
    #servlet-quiz-app .sq-hero { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 6px; padding: 14px 0 6px; }
    #servlet-quiz-app .sq-appicon { width: 56px; height: 56px; border-radius: 16px; background: var(--primary); color: var(--green); display: flex; align-items: center; justify-content: center; font-size: 28px; }
    #servlet-quiz-app .sq-chips { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }
    #servlet-quiz-app .sq-chip { padding: 3px 12px; border-radius: 999px; font-size: 12px; background: var(--muted); color: var(--muted-foreground); }
    /* 选项圆标（字母 A–D） */
    /* 答题反馈 */
    #servlet-quiz-app .sq-feedback { display: flex; gap: 10px; align-items: flex-start; }
    #servlet-quiz-app .sq-fb-ico { flex: none; font-weight: 500; }
    #servlet-quiz-app .sq-feedback.ok .sq-fb-ico { color: var(--green); }
    #servlet-quiz-app .sq-feedback.bad .sq-fb-ico { color: var(--red); }
    /* 结算页 */
    #servlet-quiz-app .sq-result-hero { text-align: center; padding: 4px 0 2px; }
    #servlet-quiz-app .sq-score-total { font-size: 18px; color: var(--muted-foreground); }
    #servlet-quiz-app .sq-acc { display: inline-block; margin-top: 8px; padding: 3px 14px; border-radius: 999px; font-size: 12px; }
    #servlet-quiz-app .sq-acc.good { background: color-mix(in srgb, var(--green) 14%, transparent); color: var(--green); }
    #servlet-quiz-app .sq-acc.mid { background: var(--muted); color: var(--muted-foreground); }
    #servlet-quiz-app .sq-acc.bad { background: color-mix(in srgb, var(--red) 12%, transparent); color: var(--red); }
    #servlet-quiz-app .sq-ok-ico { color: var(--green); }
    #servlet-quiz-app .sq-bad-ico { color: var(--red); }
    #servlet-quiz-app #sq-question { font-size: 16px; }
    /* ===== 触屏与窄屏适配 ===== */
    #servlet-quiz-app .btn { -webkit-tap-highlight-color: transparent; touch-action: manipulation; user-select: none; }
    #servlet-quiz-app .sq-cardpad { --sq-pad-x: 20px; --sq-pad-y: 20px; padding: var(--sq-pad-y) var(--sq-pad-x); }
    @media (pointer: coarse) {
      #servlet-quiz-app .btn { min-height: 44px; }
      #servlet-quiz-app .sq-optcard { min-height: 52px; }
      #servlet-quiz-app .sq-timer-num { font-size: 22px; }
      #servlet-quiz-app .sq-kbd-hint { display: none; }
    }
    @media (max-width: 480px) {
      #servlet-quiz-app .sq-cardpad { --sq-pad-x: 14px; --sq-pad-y: 16px; }
      #servlet-quiz-app #sq-question { font-size: 16px; }
      #servlet-quiz-app .sq-result-actions .btn { flex: 1 1 100%; }
    }
    #servlet-quiz-app .sq-exit { min-height: 34px; padding: 2px 10px; font-size: 12px; }
    /* 工具行 / 统计 / 背题速览 */
    #servlet-quiz-app .sq-tools { display: flex; gap: 8px; margin-top: 10px; }
    #servlet-quiz-app .sq-tools .btn { flex: 1 1 0; }
    #servlet-quiz-app .sq-search { width: 100%; padding: 9px 14px; border: 1px solid var(--border); border-radius: 10px; background: var(--card); color: var(--foreground); font: inherit; }
    #servlet-quiz-app .sq-rev-meta { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-top: 10px; }
    #servlet-quiz-app .sq-rev-item { border: 1px solid var(--border); border-radius: 10px; margin-top: 8px; overflow: hidden; }
    #servlet-quiz-app .sq-rev-item summary { cursor: pointer; display: flex; gap: 8px; align-items: baseline; padding: 10px 12px; list-style: none; }
    #servlet-quiz-app .sq-rev-item summary::-webkit-details-marker { display: none; }
    #servlet-quiz-app .sq-rev-chev { flex: none; color: var(--muted-foreground); font-size: 11px; transition: transform .15s; }
    #servlet-quiz-app .sq-rev-item[open] .sq-rev-chev { transform: rotate(90deg); }
    #servlet-quiz-app .sq-rev-num { flex: none; min-width: 2.2em; font-size: 12px; color: var(--muted-foreground); font-variant-numeric: tabular-nums; }
    #servlet-quiz-app .sq-rev-q { flex: 1; }
    #servlet-quiz-app .sq-rev-body { padding: 10px 12px; border-top: 1px solid var(--border); background: color-mix(in srgb, var(--green) 7%, transparent); }
    #servlet-quiz-app .sq-stat-top { display: flex; gap: 10px; margin-top: 12px; }
    #servlet-quiz-app .sq-stat-cell { flex: 1; text-align: center; padding: 12px 8px; border-radius: 10px; background: var(--muted); }
    #servlet-quiz-app .sq-stat-val { font-size: 22px; font-weight: 500; font-variant-numeric: tabular-nums; }
    #servlet-quiz-app .sq-stat-row { width: 100%; justify-content: flex-start; gap: 10px; margin-top: 8px; }
    #servlet-quiz-app .sq-stat-rank { flex: none; min-width: 1.6em; font-size: 12px; color: var(--muted-foreground); font-variant-numeric: tabular-nums; }
    #servlet-quiz-app .sq-stat-name { flex: none; min-width: 5.5em; text-align: left; }
    #servlet-quiz-app .sq-stat-bar { flex: 1 1 0; }
    #servlet-quiz-app .sq-bar-weak .progress-bar { background: var(--red); }
    #servlet-quiz-app .sq-bar-ok .progress-bar { background: var(--green); }
    #servlet-quiz-app .sq-subjects { display:flex; gap:8px; margin-top:14px; }
    #servlet-quiz-app .sq-subjects .btn { flex:1; min-height:46px; flex-direction:column; gap:2px; padding:6px 8px; }
    #servlet-quiz-app .sq-subjects .btn.active { border-color:var(--primary); box-shadow: inset 0 0 0 1px var(--primary); font-weight:600; }
    #servlet-quiz-app .sq-sub-name-sub { font-size:11px; font-weight:400; color:var(--muted-foreground); }
    #servlet-quiz-app .sq-start-btns { display: flex; flex-direction: column; gap: 10px; margin-top: 18px; }
    #servlet-quiz-app .sq-start-btns .btn { width: 100%; flex-direction: column; align-items: flex-start; justify-content: center; gap: 3px; min-height: 58px; padding: 9px 16px; }
    #servlet-quiz-app .sq-btn-sub { font-size: 12px; font-weight: 400; color: var(--muted-foreground); }
    #servlet-quiz-app .btn-primary .sq-btn-sub { color: var(--primary-foreground); opacity: .75; }
    @media (prefers-reduced-motion: reduce) {
      #servlet-quiz-app * { transition: none !important; animation: none !important; }
    }
  </style>

  <!-- 开始页 -->
  <div class="sq-screen card sq-cardpad" id="sq-start">
    <div class="sq-hero">
      <div class="sq-appicon" aria-hidden="true">✓</div>
      <div class="sq-title"><h2 style="margin:0;" id="sq-h2">刷题模拟</h2></div>
      <div class="sq-subtitle" id="sq-subtitle-line">核心 33 题（对准考题题号）+ 28 道变式题（覆盖其余子知识点）· 每次乱序</div>
      <div class="sq-chips">
        <span class="sq-chip">8 分钟强制收卷</span>
        <span class="sq-chip">61 题题库</span>
        <span class="sq-chip">错题本</span>
        <span class="sq-chip">离线可用</span>
      </div>
    </div>
    <div class="sq-subjects" id="sq-subjects"></div>
    <div class="sq-start-btns">
      <button type="button" class="btn btn-primary" id="sq-btn-exam"><span id="sq-exam-main">全真模拟 · 33 题 / 8 分钟</span><span class="sq-btn-sub" id="sq-exam-sub">到时强制收卷，还原真实考场压力</span></button>
      <button type="button" class="btn" id="sq-btn-quick"><span id="sq-quick-main">单题计时快刷 · 15 题 × 15 秒</span><span class="sq-btn-sub" id="sq-quick-sub">碎片时间来一轮，保持手感</span></button>
      <button type="button" class="btn" id="sq-btn-practice"><span id="sq-practice-main">练习模式 · 核心 33 题</span><span class="sq-btn-sub" id="sq-practice-sub">不限时，答完立即看解析与记忆点</span></button>
      <button type="button" class="btn" id="sq-btn-variant"><span id="sq-variant-main">变式专练 · 61 题全覆盖</span><span class="sq-btn-sub" id="sq-variant-sub">每个考点的子知识点全部兜底</span></button>
      <button type="button" class="btn" id="sq-btn-wrong" hidden></button>
    </div>
    <div class="sq-tools">
      <button type="button" class="btn btn-ghost" id="sq-btn-review">背题速览</button>
      <button type="button" class="btn btn-ghost" id="sq-btn-stats">战况统计</button>
    </div>
    <div class="text-small sq-subtitle sq-kbd-hint" style="margin-top:12px;">快捷键：数字 1–4 或字母 A–D 选答案，回车 / 空格 立即进下一题 · 全真模式答完自动跳题</div>
    <div class="text-small sq-subtitle" style="margin-top:8px; text-align:center; opacity:.8;">当前版本 <strong>v1.6</strong> · 选项显示 A/B/C/D 字母即为最新版</div>
  </div>

  <!-- 答题页 -->
  <div class="sq-screen" id="sq-quiz" hidden>
    <div class="sq-topbar">
      <button type="button" class="btn btn-ghost sq-exit" id="sq-btn-exit" aria-label="退出本局返回首页">‹ 退出</button>
      <span class="sq-topbar-title">小测模拟</span>
      <span class="text-small sq-subtitle">答对 <span id="sq-live-score" class="tabular-nums">0</span></span>
    </div>

    <div id="sq-total-wrap" class="sq-timeline" style="display:none;">
      <div class="progress" style="flex:1;" role="progressbar" aria-label="总剩余时间" aria-valuemin="0" aria-valuemax="480" aria-valuenow="480" id="sq-total-role">
        <div class="progress-bar" id="sq-total-bar" style="width:100%;"></div>
      </div>
      <span class="sq-timer-num tabular-nums" id="sq-total-num">8:00</span>
    </div>
    <div id="sq-timer-wrap" class="sq-timeline" style="display:none;">
      <div class="progress" style="flex:1;" role="progressbar" aria-label="剩余时间" aria-valuemin="0" aria-valuemax="15" aria-valuenow="15" id="sq-timer-role">
        <div class="progress-bar" id="sq-timer-bar" style="width:100%;"></div>

  <!-- 结果页 -->
  <div class="sq-screen" id="sq-result" hidden>
    <div class="card sq-cardpad">
      <div class="sq-result-hero">
        <div class="sq-subtitle text-small">本场成绩 · 答对题数</div>

  <script>
  (function () {
    var root = document.getElementById('servlet-quiz-app');
    if (!root) return;

    var LIMIT = 15; // 每题秒数（开始一局时按科目刷新）

    // ===== 题库：来自老师《第3章小测-考前精准复习资料》33 个考点 =====
    var BANK = [

        }
      } else {
        recordWrong(cur.q, cur.q.opts[cur.order[dispIdx]]);
      }
      if (run.mode === 'drill' && right) run.drillCleared.push(cur.q.id);
      recordStat(cur.q.id, right);
      saveState();
      showFeedback(right, null);

      if (run.mode === 'full') {
        cur.advanceId = setTimeout(next, 700);
      } else if (run.mode === 'exam') {
        cur.advanceId = setTimeout(next, 1500);
      } else if (run.mode === 'drill') {
        cur.advanceId = setTimeout(next, 1100);
      } else {
        $('sq-btn-next').hidden = false;
        $('sq-btn-next').focus();
      }
    }

    function onTimeout() {
      var cur = run.cur;
      if (!cur || cur.answered) return;
      cur.answered = true;
      run.answeredMs += Date.now() - cur.qStart;
      run.answeredCount++;
      lockOptions(null);
      recordWrong(cur.q, null);
      recordStat(cur.q.id, false);
      saveState();
      showFeedback(false, '超时未答');
      cur.advanceId = setTimeout(next, 1500);
    }

    function recordWrong(q, picked) {
      run.wrongIds.push(q.id);
      run.wrongDetail.push({ id: q.id, tag: q.tag, q: q.q, picked: picked, ansText: q.opts[q.ans], tip: q.tip });
    }

    function showFeedback(right, prefix) {
      var head = prefix ? prefix + ' · ' : '';
      var html;
      if (right) {
        html = '<div class="sq-feedback ok"><span class="sq-fb-ico">✓</span><div><strong>答对了</strong><div class="text-small sq-subtitle" style="margin-top:2px;">' + esc(run.cur.q.tip) + '</div></div></div>';
      } else {
        html = '<div class="sq-feedback bad"><span class="sq-fb-ico">✕</span><div><strong>' + head + '正确答案：' + esc(run.cur.q.opts[run.cur.q.ans]) + '</strong><div class="text-small sq-subtitle" style="margin-top:2px;">' + esc(run.cur.q.tip) + '</div></div></div>';
      }
      $('sq-feedback-wrap').innerHTML = html;
    }

    function next() {
      if (!run) return;
      var cur = run.cur;
      if (cur && cur.advanceId) { clearTimeout(cur.advanceId); cur.advanceId = null; }
      if (run.idx + 1 >= run.queue.length) { finish(); return; }
      run.idx++;
      renderQuestion();
    }
    $('sq-btn-next').addEventListener('click', next);

    // ===== 全真模式：8 分钟总计时，到时强制收卷 =====
    function fmtClock(ms) {
      var s = Math.max(0, Math.ceil(ms / 1000));
      var m = Math.floor(s / 60), r = s % 60;
      return m + ':' + (r < 10 ? '0' : '') + r;
    }
    function startTotalTimer() {
      var end = Date.now() + TOTAL_MS;
      function tick() {
        if (!run || run.done) return;
        var leftMs = end - Date.now();
        var num = $('sq-total-num'), bar = $('sq-total-bar'), role = $('sq-total-role');
        if (leftMs <= 0) {
          num.textContent = '0:00'; num.classList.add('low'); bar.style.width = '0%';
          forceFinish(); return;
        }
        num.textContent = fmtClock(leftMs);
        num.classList.toggle('low', leftMs <= 60000);
        bar.style.width = (leftMs / TOTAL_MS * 100) + '%';
        role.setAttribute('aria-valuenow', String(Math.ceil(leftMs / 1000)));
        run.totalTimerId = setTimeout(tick, 200);
      }
      tick();
    }
    function forceFinish() {
      if (!run || run.done) return;
      if (run.cur) {
        if (run.cur.advanceId) { clearTimeout(run.cur.advanceId); run.cur.advanceId = null; }
        if (run.cur.timerId) { clearTimeout(run.cur.timerId); run.cur.timerId = null; }
        if (!run.cur.answered) { run.cur.answered = true; recordWrong(run.cur.q, null); }
      }
      for (var i = run.idx + 1; i < run.queue.length; i++) recordWrong(run.queue[i], null);
      finish();
    }

    // ===== 结算 =====
    function finish() {
      if (run.done) return;
      run.done = true;
      if (run.totalTimerId) { clearTimeout(run.totalTimerId); run.totalTimerId = null; }
      if (run.cur && run.cur.timerId) { clearTimeout(run.cur.timerId); run.cur.timerId = null; }
      var total = (run.mode === 'drill') ? run.base.length : run.queue.length;
      var score = (run.mode === 'drill') ? run.drillCleared.length : run.correct;
      var wrongN = total - score;
      var avg = run.answeredCount ? (run.answeredMs / run.answeredCount / 1000) : 0;

      // 累计错题本（含本场之前存的）
      var ids = run.wrongIds.slice();
      loadSaved().forEach(function (id) { if (ids.indexOf(id) < 0) ids.push(id); });
      if (run.mode === 'drill') {
        run.drillCleared.forEach(function (id) {
          var i = ids.indexOf(id);
          if (i >= 0) ids.splice(i, 1);
        });
        var pickedMap = {};
        run.wrongDetail.forEach(function (w) { pickedMap[w.id] = w.picked; });
        run.wrongDetail = run.base.filter(function (q) {
          return run.drillCleared.indexOf(q.id) < 0;
        }).map(function (q) {
          return { id: q.id, tag: q.tag, q: q.q, picked: pickedMap[q.id] || null, ansText: q.opts[q.ans], tip: q.tip };
        });
      }
      run.wrongAllTime = ids;
      saveState();

      $('sq-score').textContent = String(score);
      $('sq-total').textContent = String(total);
      var modeName = run.mode === 'full' ? '全真模式' : (run.mode === 'exam' ? '单题计时' : (run.mode === 'drill' ? '错题歼灭' : '练习模式'));
      var usedSec = Math.round((Date.now() - run.startAt) / 1000);
      var usedStr = Math.floor(usedSec / 60) + ':' + (usedSec % 60 < 10 ? '0' : '') + (usedSec % 60);
      var pct = total ? Math.round(score / total * 100) : 0;
      var acc = $('sq-acc');
      acc.textContent = '正确率 ' + pct + '%' + (wrongN === 0 ? (run.mode === 'drill' ? ' · 错题全部歼灭！' : ' · 全对，漂亮！') : '');
      acc.className = 'sq-acc ' + (pct >= 80 ? 'good' : (pct >= 60 ? 'mid' : 'bad'));
      $('sq-result-chips').innerHTML =
        '<span class="sq-chip">' + modeName + '</span>' +
        '<span class="sq-chip">用时 ' + usedStr + '</span>' +
        '<span class="sq-chip">平均 ' + avg.toFixed(1) + ' 秒/题</span>' +
        (run.mode === 'drill' ? '<span class="sq-chip">清零 ' + score + '/' + total + '</span>' : '') +
        (wrongN === 0 ? '' : '<span class="sq-chip">错/未答 ' + wrongN + ' 题</span>');

      var list = $('sq-wrong-list');
      if (run.wrongDetail.length === 0) {
        $('sq-wrong-card').hidden = true;
      } else {
        $('sq-wrong-card').hidden = false;
        $('sq-wrong-count').textContent = String(run.wrongDetail.length);
        list.innerHTML = run.wrongDetail.map(function (w) {
          return '<div class="sq-wrong-item">' +
            '<div class="text-small sq-subtitle">' + esc(w.tag) + '</div>' +
            '<div style="margin:2px 0 4px;">' + esc(w.q) + '</div>' +
            '<div class="text-small"><span class="sq-ok-ico">✓</span> <strong>' + esc(w.ansText) + '</strong></div>' +
            (w.picked ? '<div class="text-small sq-subtitle"><span class="sq-bad-ico">✗</span> 你选了：' + esc(w.picked) + '</div>' : '<div class="text-small sq-subtitle"><span class="sq-bad-ico">✗</span> 未作答（超时）</div>') +
            '<div class="text-small" style="margin-top:2px;">' + esc(w.tip) + '</div>' +
            '</div>';
        }).join('');
      }

      var b2 = $('sq-btn-wrong2');
      if (ids.length > 0) {
        b2.hidden = false;
        b2.textContent = '错题歼灭（' + ids.length + ' 题）';
      } else {
        b2.hidden = true;
      }
      show('result');
    }

    $('sq-btn-again').addEventListener('click', function () {
      if (run.mode === 'drill') {
        startDrill(run.wrongAllTime.map(function (id) { return ALLQ[id]; }).filter(Boolean));
      } else {
        startRun(run.mode, run.base);
      }
    });
    $('sq-btn-wrong2').addEventListener('click', function () {
      var s = subjectIds();
      var ids = (run.wrongAllTime || loadSaved()).filter(function (id) { return s[id]; });
      var list = ids.map(function (id) { return ALLQ[id]; }).filter(Boolean);
      if (list.length) startDrill(list);
    });
    function goHome() {
      if (run) {
        if (run.cur) {
          if (run.cur.timerId) { clearTimeout(run.cur.timerId); run.cur.timerId = null; }
          if (run.cur.advanceId) { clearTimeout(run.cur.advanceId); run.cur.advanceId = null; }
        }
        if (run.totalTimerId) { clearTimeout(run.totalTimerId); run.totalTimerId = null; }
        run.done = true;
      }
      run = null;
      renderStartButtons();
      show('start');
      window.scrollTo(0, 0);
    }
    $('sq-btn-exit').addEventListener('click', goHome);
    $('sq-btn-home').addEventListener('click', goHome);
    window.sqHandleBack = function () {
      if (!screens.start.hidden) return false;
      goHome();
      return true;
    };

    // ===== 错题歼灭：错题连刷，答错重新入队，答对清零 =====
    function startDrill(list) {
      run = {
        mode: 'drill',
        base: list.slice(),
        queue: shuffle(list),
        idx: 0,
        correct: 0,
        wrongIds: [],
        wrongDetail: [],
        drillCleared: [],
        answeredMs: 0,
        answeredCount: 0,
        startAt: Date.now(),
        totalTimerId: null,
        done: false
      };
      show('quiz');
      renderQuestion();
    }

    // ===== 战况统计：薄弱知识点排行，点击专项直刷 =====
    function renderStats() {
      var body = $('sq-stats-body');
      var tags = {}, totalA = 0, totalC = 0;
      Object.keys(STATS).forEach(function (qid) {
        var q = ALLQ[qid];
        if (!q) return;
        var s = STATS[qid];
        totalA += s[0]; totalC += s[1];
        var t = tags[q.tag] || (tags[q.tag] = [0, 0]);
        t[0] += s[0]; t[1] += s[1];
      });
      if (totalA === 0) {
        body.innerHTML = '<div class="sq-subtitle" style="margin-top:10px;">还没有答题记录——先去刷一轮，回来就能看到薄弱知识点排行。</div>';
        return;
      }
      var pct = Math.round(totalC / totalA * 100);
      var rows = Object.keys(tags).map(function (tag) {
        return { tag: tag, a: tags[tag][0], c: tags[tag][1] };
      }).sort(function (x, y) { return (x.c / x.a) - (y.c / y.a) || y.a - x.a; });
      var html = '<div class="sq-stat-top">' +
        '<div class="sq-stat-cell"><div class="text-small sq-subtitle">累计作答</div><div class="sq-stat-val">' + totalA + ' 次</div></div>' +
        '<div class="sq-stat-cell"><div class="text-small sq-subtitle">总正确率</div><div class="sq-stat-val">' + pct + '%</div></div>' +
        '</div>' +
        '<div class="text-small sq-subtitle" style="margin-top:10px;">薄弱在前，点击知识点直接专项刷 · <span style="color:var(--red)">红 &lt;60%</span> / 60–79% / <span style="color:var(--green)">绿 ≥80%</span></div>';
      rows.forEach(function (r, i) {
        var p = Math.round(r.c / r.a * 100);
        var barCls = (p < 60) ? ' sq-bar-weak' : ((p >= 80) ? ' sq-bar-ok' : '');
        html += '<button type="button" class="btn sq-stat-row" data-tag="' + esc(r.tag) + '">' +
          '<span class="sq-stat-rank">' + (i + 1) + '</span>' +
          '<span class="sq-stat-name">' + esc(r.tag) + '</span>' +
          '<span class="progress sq-stat-bar' + barCls + '"><span class="progress-bar" style="width:' + p + '%"></span></span>' +
          '<span class="tabular-nums text-small" style="flex:none; min-width:3em; text-align:right;">' + p + '%</span>' +
          '<span class="text-small sq-subtitle" style="flex:none;">' + r.a + ' 次</span></button>';
      });
      body.innerHTML = html;
      body.querySelectorAll('.sq-stat-row').forEach(function (b) {
        b.addEventListener('click', function () { startTagPractice(b.getAttribute('data-tag')); });
      });
    }
    function startTagPractice(tag) {
      var list = [];
      Object.keys(SUBJECTS).forEach(function (k) {
        list = list.concat(SUBJECTS[k].bank, SUBJECTS[k].variants);
      });
      list = list.filter(function (q) { return q.tag === tag; });
      if (list.length) startRun('practice', list);
    }

    // ===== 背题速览：题干点击展开答案与记忆点，支持搜索 =====
    function renderReview(keyword) {
      var kw = (keyword || '').trim().toLowerCase();
      var all = curCfg().bank.concat(curCfg().variants);
      var list = all.filter(function (q) {
        if (!kw) return true;
        var hay = (q.q + ' ' + q.tag + ' ' + q.opts[q.ans] + ' ' + q.tip).toLowerCase();
        return hay.indexOf(kw) >= 0;
      });
      var meta = kw ? ('匹配 ' + list.length + ' / ' + all.length + ' 题') : ('共 ' + all.length + ' 题 · 点击题干展开答案');
      var html = '<div class="sq-rev-meta"><span class="text-small sq-subtitle">' + meta + '</span></div>';
      list.forEach(function (q) {
        var num = all.indexOf(q) + 1;
        html += '<details class="sq-rev-item"><summary>' +
          '<span class="sq-rev-chev">▶</span>' +
          '<span class="sq-rev-num">' + num + '</span>' +
          '<span class="sq-rev-q"><span class="sq-chip">' + esc(q.tag) + '</span> ' + esc(q.q) + '</span></summary>' +
          '<div class="sq-rev-body"><div><span class="sq-ok-ico">✓</span> <strong>' + esc(q.opts[q.ans]) + '</strong></div>' +
          '<div class="text-small sq-subtitle" style="margin-top:4px;">' + esc(q.tip) + '</div></div></details>';
      });
      if (!list.length) html += '<div class="sq-subtitle" style="margin-top:8px;">没有匹配的题目，换个关键词试试。</div>';
      $('sq-review-list').innerHTML = html;
    }
    function setReviewOpen(open) {
      $('sq-review-list').querySelectorAll('details').forEach(function (d) { d.open = open; });
    }

    // ===== 键盘 =====
    document.addEventListener('keydown', function (ev) {
      if (!run || screens.quiz.hidden) return;
      var cur = run.cur;
      if (!cur) return;
      var k = ev.key;
      if (!cur.answered) {
        var map = { '1': 0, '2': 1, '3': 2, '4': 3, 'a': 0, 'b': 1, 'c': 2, 'd': 3 };
        var kl = k.toLowerCase();
        if (kl in map) {
          var btns = $('sq-options').querySelectorAll('.sq-optcard');
          if (btns[map[kl]] && !btns[map[kl]].disabled) answer(map[kl]);
          ev.preventDefault();
        }
      } else {
        if (k === 'Enter' || k === ' ') { next(); ev.preventDefault(); }
      }
    });

    renderSubject();
    renderStartButtons();
  })();
  </script>
</div>

<script>
  if ('serviceWorker' in navigator && location.protocol === 'https:') {
    navigator.serviceWorker.register('./sw.js').catch(function () {});
  }
</script>
</body>
