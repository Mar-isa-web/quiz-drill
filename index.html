<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>刷题模拟器 · Servlet / 计组 / 数据库</title>
<meta name="description" content="科目刷题：Servlet 考点 + 计组期末真题单选；全真计时模拟、错题歼灭、背题速览、战况统计">
<style>
  :root { color-scheme: light dark; }
  :root {
    --background:#f6f7f9; --foreground:#1a1d21;
    --card:#ffffff; --card-foreground:#1a1d21;
    --muted:#eceef1; --muted-foreground:#5c6470; --border:#d8dce2;
    --primary:#1f2937; --primary-foreground:#ffffff;
    --green:#1a9c6b; --red:#d64545;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --background:#15171b; --foreground:#e8eaee;
      --card:#1e2126; --card-foreground:#e8eaee;
      --muted:#2a2e35; --muted-foreground:#a2aab6; --border:#343941;
      --primary:#e8eaee; --primary-foreground:#15171b;
      --green:#3ecf8e; --red:#f87171;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin:0; padding:20px 16px 40px;
    background:var(--background); color:var(--foreground);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    font-size:14px; line-height:1.5;
    -webkit-text-size-adjust:100%;
  }
  @media (max-width: 480px) {
    body { padding: 20px 10px calc(env(safe-area-inset-bottom, 0px) + 28px); }
  }
  h1,h2,h3 { line-height:1.3; margin:0; }
  .card { background:var(--card); color:var(--card-foreground); border:1px solid var(--border); border-radius:12px; }
  .btn {
    display:inline-flex; align-items:center; justify-content:center; gap:8px;
    min-height:32px; padding:4px 14px; border-radius:8px;
    border:1px solid var(--border); background:var(--card); color:var(--foreground);
    font:inherit; cursor:pointer; text-decoration:none;
  }
  .btn:hover { border-color:var(--muted-foreground); }
  .btn-primary { background:var(--primary); color:var(--primary-foreground); border-color:transparent; }
  .btn-primary:hover { opacity:.9; border-color:transparent; }
  .btn-ghost { background:transparent; border-color:transparent; }
  .btn-ghost:hover { border-color:var(--border); }
  .progress { display:flex; height:8px; border-radius:999px; background:var(--muted); overflow:hidden; }
  .progress-bar { height:100%; background:var(--primary); border-radius:999px; transition:width .15s linear; }
  .viz-badge { display:inline-block; padding:2px 10px; border-radius:999px; font-size:12px; background:var(--muted); color:var(--foreground); }
  .viz-row { display:flex; flex-wrap:wrap; align-items:center; gap:10px; }
  .text-small { font-size:12px; }
  .tabular-nums { font-variant-numeric:tabular-nums; }
  [data-lucide] { display:inline-block; width:16px; height:16px; font-style:normal; line-height:1; overflow:hidden; }
  [data-lucide="timer"]::before { content:"\23F1\FE0F"; }
  [data-lucide="alarm-clock"]::before { content:"\23F0\FE0F"; }
</style>
<script>
  window.zcode = (function () {
    var KEY = 'sq-quiz-state-v1';
    function load() {
      try { return JSON.parse(localStorage.getItem(KEY) || 'null'); }
      catch (e) { return null; }
    }
    return {
      get widgetState() { return load(); },
      setWidgetState: function (p) {
        try { localStorage.setItem(KEY, JSON.stringify(p || null)); } catch (e) {}
        return Promise.resolve(true);
      }
    };
  })();
</script>
<meta name="theme-color" content="#1f2937">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="小测模拟">
</head>
<body>
<div id="servlet-quiz-app">

  <style>
    #servlet-quiz-app { max-width: 720px; margin: 0 auto; }
    #servlet-quiz-app [hidden] { display: none !important; }
    #servlet-quiz-app .sq-title { font-weight: 500; margin-bottom: 4px; }
    #servlet-quiz-app .sq-subtitle { color: var(--muted-foreground); }
    #servlet-quiz-app .sq-options { display: flex; flex-direction: column; gap: 10px; margin-top: auto; padding-top: 20px; }
    /* 答题页纵向弹性布局：题卡在上，选项推到屏幕中下部 */
    #servlet-quiz-app #sq-quiz { display: flex; flex-direction: column; min-height: 76vh; min-height: calc(100dvh - 130px); }
    #servlet-quiz-app .sq-topbar { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 10px; }
    #servlet-quiz-app .sq-topbar-title { font-weight: 500; }
    #servlet-quiz-app .sq-timeline { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
    #servlet-quiz-app .sq-qhead { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 8px; }
    #servlet-quiz-app .sq-optcard {
      display: flex; align-items: flex-start; gap: 10px; width: 100%; text-align: left;
      border: 1px solid var(--border); border-radius: 12px; background: var(--card); color: var(--foreground);
      padding: 12px 14px; font: inherit; cursor: pointer; min-height: 48px; line-height: 1.45; white-space: normal;
    }
    #servlet-quiz-app .sq-optcard:hover { border-color: var(--muted-foreground); }
    #servlet-quiz-app .sq-optcard:disabled { cursor: default; }
    #servlet-quiz-app .sq-optcard:disabled:not(.is-correct):not(.is-wrong) { opacity: .55; }
    #servlet-quiz-app .sq-optcard.is-correct { border-color: var(--green); box-shadow: inset 0 0 0 1px var(--green); }
    #servlet-quiz-app .sq-optcard.is-wrong { border-color: var(--red); box-shadow: inset 0 0 0 1px var(--red); }
    #servlet-quiz-app .opt-key { flex: none; width: 26px; height: 26px; margin-top: 1px; border-radius: 999px; border: 1px solid var(--border); display: inline-flex; align-items: center; justify-content: center; font-size: 13px; color: var(--muted-foreground); }
    #servlet-quiz-app .opt-text { flex: 1; }
    #servlet-quiz-app .sq-optcard.is-correct .opt-key { border-color: var(--green); color: var(--green); }
    #servlet-quiz-app .sq-optcard.is-wrong .opt-key { border-color: var(--red); color: var(--red); }
    /* 选项状态色由 .sq-optcard 规则提供 */
    #servlet-quiz-app .sq-timer-num { font-size: 20px; font-weight: 500; font-variant-numeric: tabular-nums; }
    #servlet-quiz-app .sq-timer-num.low { color: var(--red); }
    #servlet-quiz-app .sq-feedback { margin-top: 12px; border-radius: 8px; padding: 10px 12px; }
    #servlet-quiz-app .sq-feedback.ok { background: color-mix(in srgb, var(--green) 12%, transparent); }
    #servlet-quiz-app .sq-feedback.bad { background: color-mix(in srgb, var(--red) 10%, transparent); }
    #servlet-quiz-app .sq-wrong-item { padding: 10px 0; border-top: 1px solid var(--border); }
    #servlet-quiz-app .sq-wrong-item:first-of-type { border-top: none; }
    #servlet-quiz-app .sq-score-big { font-size: 40px; font-weight: 500; font-variant-numeric: tabular-nums; line-height: 1.15; }
    /* 首页 hero */
    #servlet-quiz-app .sq-hero { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 6px; padding: 14px 0 6px; }
    #servlet-quiz-app .sq-appicon { width: 56px; height: 56px; border-radius: 16px; background: var(--primary); color: var(--green); display: flex; align-items: center; justify-content: center; font-size: 28px; }
    #servlet-quiz-app .sq-chips { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }
    #servlet-quiz-app .sq-chip { padding: 3px 12px; border-radius: 999px; font-size: 12px; background: var(--muted); color: var(--muted-foreground); }
    /* 选项圆标（字母 A–D） */
    /* 答题反馈 */
    #servlet-quiz-app .sq-feedback { display: flex; gap: 10px; align-items: flex-start; }
    #servlet-quiz-app .sq-fb-ico { flex: none; font-weight: 500; }
    #servlet-quiz-app .sq-feedback.ok .sq-fb-ico { color: var(--green); }
    #servlet-quiz-app .sq-feedback.bad .sq-fb-ico { color: var(--red); }
    /* 结算页 */
    #servlet-quiz-app .sq-result-hero { text-align: center; padding: 4px 0 2px; }
    #servlet-quiz-app .sq-score-total { font-size: 18px; color: var(--muted-foreground); }
    #servlet-quiz-app .sq-acc { display: inline-block; margin-top: 8px; padding: 3px 14px; border-radius: 999px; font-size: 12px; }
    #servlet-quiz-app .sq-acc.good { background: color-mix(in srgb, var(--green) 14%, transparent); color: var(--green); }
    #servlet-quiz-app .sq-acc.mid { background: var(--muted); color: var(--muted-foreground); }
    #servlet-quiz-app .sq-acc.bad { background: color-mix(in srgb, var(--red) 12%, transparent); color: var(--red); }
    #servlet-quiz-app .sq-ok-ico { color: var(--green); }
    #servlet-quiz-app .sq-bad-ico { color: var(--red); }
    #servlet-quiz-app #sq-question { font-size: 16px; }
    /* ===== 触屏与窄屏适配 ===== */
    #servlet-quiz-app .btn { -webkit-tap-highlight-color: transparent; touch-action: manipulation; user-select: none; }
    #servlet-quiz-app .sq-cardpad { --sq-pad-x: 20px; --sq-pad-y: 20px; padding: var(--sq-pad-y) var(--sq-pad-x); }
    @media (pointer: coarse) {
      #servlet-quiz-app .btn { min-height: 44px; }
      #servlet-quiz-app .sq-optcard { min-height: 52px; }
      #servlet-quiz-app .sq-timer-num { font-size: 22px; }
      #servlet-quiz-app .sq-kbd-hint { display: none; }
    }
    @media (max-width: 480px) {
      #servlet-quiz-app .sq-cardpad { --sq-pad-x: 14px; --sq-pad-y: 16px; }
      #servlet-quiz-app #sq-question { font-size: 16px; }
      #servlet-quiz-app .sq-result-actions .btn { flex: 1 1 100%; }
    }
    #servlet-quiz-app .sq-exit { min-height: 34px; padding: 2px 10px; font-size: 12px; }
    /* 工具行 / 统计 / 背题速览 */
    #servlet-quiz-app .sq-tools { display: flex; gap: 8px; margin-top: 10px; }
    #servlet-quiz-app .sq-tools .btn { flex: 1 1 0; }
    #servlet-quiz-app .sq-search { width: 100%; padding: 9px 14px; border: 1px solid var(--border); border-radius: 10px; background: var(--card); color: var(--foreground); font: inherit; }
    #servlet-quiz-app .sq-rev-meta { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-top: 10px; }
    #servlet-quiz-app .sq-rev-item { border: 1px solid var(--border); border-radius: 10px; margin-top: 8px; overflow: hidden; }
    #servlet-quiz-app .sq-rev-item summary { cursor: pointer; display: flex; gap: 8px; align-items: baseline; padding: 10px 12px; list-style: none; }
    #servlet-quiz-app .sq-rev-item summary::-webkit-details-marker { display: none; }
    #servlet-quiz-app .sq-rev-chev { flex: none; color: var(--muted-foreground); font-size: 11px; transition: transform .15s; }
    #servlet-quiz-app .sq-rev-item[open] .sq-rev-chev { transform: rotate(90deg); }
    #servlet-quiz-app .sq-rev-num { flex: none; min-width: 2.2em; font-size: 12px; color: var(--muted-foreground); font-variant-numeric: tabular-nums; }
    #servlet-quiz-app .sq-rev-q { flex: 1; }
    #servlet-quiz-app .sq-rev-body { padding: 10px 12px; border-top: 1px solid var(--border); background: color-mix(in srgb, var(--green) 7%, transparent); }
    #servlet-quiz-app .sq-stat-top { display: flex; gap: 10px; margin-top: 12px; }
    #servlet-quiz-app .sq-stat-cell { flex: 1; text-align: center; padding: 12px 8px; border-radius: 10px; background: var(--muted); }
    #servlet-quiz-app .sq-stat-val { font-size: 22px; font-weight: 500; font-variant-numeric: tabular-nums; }
    #servlet-quiz-app .sq-stat-row { width: 100%; justify-content: flex-start; gap: 10px; margin-top: 8px; }
    #servlet-quiz-app .sq-stat-rank { flex: none; min-width: 1.6em; font-size: 12px; color: var(--muted-foreground); font-variant-numeric: tabular-nums; }
    #servlet-quiz-app .sq-stat-name { flex: none; min-width: 5.5em; text-align: left; }
    #servlet-quiz-app .sq-stat-bar { flex: 1 1 0; }
    #servlet-quiz-app .sq-bar-weak .progress-bar { background: var(--red); }
    #servlet-quiz-app .sq-bar-ok .progress-bar { background: var(--green); }
    #servlet-quiz-app .sq-subjects { display:flex; flex-wrap:wrap; gap:8px; margin-top:14px; }
    #servlet-quiz-app .sq-subjects .btn { flex:1 1 220px; min-width:0; }
    #servlet-quiz-app .sq-subjects .btn { min-height:46px; flex-direction:column; gap:2px; padding:6px 8px; align-items:center; text-align:center; }
    #servlet-quiz-app .sq-subjects .btn.active { border-color:var(--primary); box-shadow: inset 0 0 0 1px var(--primary); font-weight:600; }
    #servlet-quiz-app .sq-modules-wrap { flex-wrap:wrap; margin-top:8px; }
    #servlet-quiz-app .sq-modules-wrap .btn { flex:1 1 150px; min-height:46px; flex-direction:column; gap:2px; padding:6px 8px; }
    #servlet-quiz-app .sq-sub-name-sub { font-size:11px; font-weight:400; color:var(--muted-foreground); line-height:1.35; word-break:break-word; }
    #servlet-quiz-app .sq-home-list { display:flex; flex-direction:column; gap:10px; margin-top:16px; }
    #servlet-quiz-app .sq-home-list .btn { flex:none; width:100%; min-height:66px; flex-direction:row; align-items:center; justify-content:space-between; text-align:left; gap:10px; padding:12px 14px; }
    #servlet-quiz-app .sq-home-list .btn.active { border-color:var(--border); box-shadow:none; }
    #servlet-quiz-app .sq-home-main { display:flex; flex-direction:column; gap:3px; min-width:0; }
    #servlet-quiz-app .sq-home-name { font-size:15px; font-weight:600; }
    #servlet-quiz-app .sq-home-side { display:flex; flex-direction:column; align-items:flex-end; gap:3px; flex:none; }
    #servlet-quiz-app .sq-home-chev { color:var(--muted-foreground); font-size:18px; line-height:1; }
    #servlet-quiz-app .sq-backbar { margin-bottom:8px; display:flex; }
    #servlet-quiz-app .sq-btn-back { min-height:34px; padding:4px 12px; font-size:13px; }
    #servlet-quiz-app .sq-start-btns { display: flex; flex-direction: column; gap: 10px; margin-top: 18px; }
    #servlet-quiz-app .sq-start-btns .btn { width: 100%; flex-direction: column; align-items: flex-start; justify-content: center; gap: 3px; min-height: 58px; padding: 9px 16px; }
    #servlet-quiz-app .sq-btn-sub { font-size: 12px; font-weight: 400; color: var(--muted-foreground); }
    #servlet-quiz-app .btn-primary .sq-btn-sub { color: var(--primary-foreground); opacity: .75; }
    @media (prefers-reduced-motion: reduce) {
      #servlet-quiz-app * { transition: none !important; animation: none !important; }
    }
  </style>

  <!-- 科目选择（第一界面） -->
  <div class="sq-screen card sq-cardpad" id="sq-home">
    <div class="sq-hero">
      <div class="sq-appicon" aria-hidden="true">✓</div>
      <div class="sq-title"><h2 style="margin:0;">刷题模拟器</h2></div>
    </div>
    <div class="sq-subjects sq-home-list" id="sq-subjects"></div>
  </div>

  <!-- 开始页（第二界面：科目内） -->
  <div class="sq-screen card sq-cardpad" id="sq-start">
    <div class="sq-backbar"><button type="button" class="btn btn-ghost sq-btn-back" id="sq-btn-back">‹ 返回科目</button></div>
    <div class="sq-hero">
      <div class="sq-appicon" aria-hidden="true">✓</div>
      <div class="sq-title"><h2 style="margin:0;" id="sq-h2">刷题模拟</h2></div>
    </div>
    <div class="sq-subjects sq-modules-wrap" id="sq-modules" hidden></div>
    <div class="sq-start-btns">
      <button type="button" class="btn btn-primary" id="sq-btn-exam"><span id="sq-exam-main">全真模拟 · 33 题 / 8 分钟</span><span class="sq-btn-sub" id="sq-exam-sub">到时强制收卷，还原真实考场压力</span></button>
      <button type="button" class="btn" id="sq-btn-quick"><span id="sq-quick-main">单题计时快刷 · 15 题 × 15 秒</span><span class="sq-btn-sub" id="sq-quick-sub">碎片时间来一轮，保持手感</span></button>
      <button type="button" class="btn" id="sq-btn-practice"><span id="sq-practice-main">练习模式 · 核心 33 题</span><span class="sq-btn-sub" id="sq-practice-sub">不限时，答完立即看解析与记忆点</span></button>
      <button type="button" class="btn" id="sq-btn-variant"><span id="sq-variant-main">变式专练 · 61 题全覆盖</span><span class="sq-btn-sub" id="sq-variant-sub">每个考点的子知识点全部兜底</span></button>
      <button type="button" class="btn" id="sq-btn-wrong" hidden></button>
    </div>
    <div class="sq-tools">
      <button type="button" class="btn btn-ghost" id="sq-btn-review">背题速览</button>
      <button type="button" class="btn btn-ghost" id="sq-btn-stats">战况统计</button>
    </div>
  </div>

  <!-- 答题页 -->
  <div class="sq-screen" id="sq-quiz" hidden>
    <div class="sq-topbar">
      <button type="button" class="btn btn-ghost sq-exit" id="sq-btn-exit" aria-label="退出本局返回首页">‹ 退出</button>
      <span class="sq-topbar-title">小测模拟</span>
      <span class="text-small sq-subtitle">答对 <span id="sq-live-score" class="tabular-nums">0</span></span>
    </div>

    <div id="sq-total-wrap" class="sq-timeline" style="display:none;">
      <div class="progress" style="flex:1;" role="progressbar" aria-label="总剩余时间" aria-valuemin="0" aria-valuemax="480" aria-valuenow="480" id="sq-total-role">
        <div class="progress-bar" id="sq-total-bar" style="width:100%;"></div>
      </div>
      <span class="sq-timer-num tabular-nums" id="sq-total-num">8:00</span>
    </div>
    <div id="sq-timer-wrap" class="sq-timeline" style="display:none;">
      <div class="progress" style="flex:1;" role="progressbar" aria-label="剩余时间" aria-valuemin="0" aria-valuemax="15" aria-valuenow="15" id="sq-timer-role">
        <div class="progress-bar" id="sq-timer-bar" style="width:100%;"></div>
      </div>
      <span class="sq-timer-num tabular-nums" id="sq-timer-num">15</span>
    </div>

    <div class="card sq-cardpad">
      <div class="sq-qhead">
        <span class="text-small sq-subtitle tabular-nums" id="sq-progress">第 1/33 题</span>
        <span class="viz-badge" id="sq-tag">单选题</span>
      </div>
      <div id="sq-question" aria-live="polite" style="font-weight:500;"></div>
    </div>

    <div class="sq-options" id="sq-options" role="group" aria-label="选项"></div>
    <div id="sq-feedback-wrap" aria-live="polite"></div>
    <div style="margin-top:12px; display:flex; justify-content:flex-end;">
      <button type="button" class="btn btn-primary" id="sq-btn-next" hidden>下一题（回车）</button>
    </div>
  </div>

  <!-- 结果页 -->
  <div class="sq-screen" id="sq-result" hidden>
    <div class="card sq-cardpad">
      <div class="sq-result-hero">
        <div class="sq-subtitle text-small">本场成绩 · 答对题数</div>
        <div class="sq-score-big"><span id="sq-score">0</span><span class="sq-score-total"> / <span id="sq-total">33</span></span></div>
        <span class="sq-acc mid" id="sq-acc">--</span>
      </div>
      <div class="sq-chips" id="sq-result-chips" style="margin-top:10px;"></div>
      <div class="viz-row sq-result-actions" style="margin-top:14px; gap:8px;">
        <button type="button" class="btn btn-primary" id="sq-btn-again">再刷一遍（乱序）</button>
        <button type="button" class="btn" id="sq-btn-wrong2" hidden>只刷错题</button>
        <button type="button" class="btn btn-ghost" id="sq-btn-home">返回首页</button>
      </div>
    </div>
    <div class="card sq-cardpad" id="sq-wrong-card" style="margin-top:12px;" hidden>
      <h3 style="margin:0 0 4px;">错题本（<span id="sq-wrong-count">0</span> 题）</h3>
      <div class="text-small sq-subtitle" style="margin-bottom:8px;">睡前把这里过一遍，明天考前再看一眼。</div>
      <div id="sq-wrong-list"></div>
    </div>
  </div>

  <!-- 战况统计 -->
  <div class="sq-screen card sq-cardpad" id="sq-stats" hidden>
    <div style="display:flex; justify-content:space-between; align-items:center; gap:8px;">
      <h2 style="margin:0;">战况统计</h2>
      <button type="button" class="btn btn-ghost sq-exit" id="sq-stats-back">‹ 返回</button>
    </div>
    <div id="sq-stats-body" style="margin-top:8px;"></div>
  </div>

  <!-- 背题速览 -->
  <div class="sq-screen card sq-cardpad" id="sq-review" hidden>
    <div style="display:flex; justify-content:space-between; align-items:center; gap:8px;">
      <h2 style="margin:0;">背题速览</h2>
      <button type="button" class="btn btn-ghost sq-exit" id="sq-review-back">‹ 返回</button>
    </div>
    <input type="search" class="sq-search" id="sq-review-search" style="margin-top:10px;" placeholder="搜题干、知识点、答案关键词…" aria-label="搜索题目">

      { id: 520, sec: '绪论', tag: '复杂度化简', q: "一个算法的时间复杂度为 (n³+n²·logn+14n)/(n²)，其数量级表示为____。", opts: ["O(n)", "O(n²)", "O(logn)", "O(n³)"], ans: 0, tip: "原式化简为 n + logn + 14/n，最高阶项为 n，故数量级为 O(n)。取最高阶、去系数。" },
      { id: 521, sec: '绪论', tag: '基本概念层级', q: "数据的基本单位是____，最小单位是____。", opts: ["数据元素；数据项", "数据项；数据元素", "数据元素；数据元素", "数据项；数据项"], ans: 0, tip: "数据元素是数据的基本单位；数据项是构成数据元素的、不可分割的最小单位。" },
      { id: 522, sec: '绪论', tag: '学科框架', q: "数据结构研究的3个方面分别是数据的____、数据的____和数据的操作。", opts: ["逻辑结构；存储结构", "顺序结构；链式结构", "数组；链表", "集合；树形"], ans: 0, tip: "数据结构三个侧面：逻辑结构、存储结构（物理结构）以及数据的运算（操作）。" },
      { id: 523, sec: '绪论', tag: '逻辑结构两大类', q: "按照结点之间的逻辑关系，数据结构可以分为____和____两大类。", opts: ["线性结构；非线性结构", "顺序结构；链式结构", "集合结构；图形结构", "数组结构；链表结构"], ans: 0, tip: "按逻辑关系分：线性结构（线性表、栈、队列、字符串）与非线性结构（树、图等）两大类。" },
      { id: 524, sec: '绪论', tag: '复杂度化简', q: "一个算法的时间复杂度为 (n³+n²logn+14n)/n²（图片公式），其数量级表示为____。", opts: ["O(n)", "O(n²)", "O(nlogn)", "O(1)"], ans: 0, tip: "公式与上一题相同，化简后最高阶项为 n，故数量级为 O(n)。" },
      { id: 525, sec: '绪论', tag: '逻辑与存储关系', q: "逻辑结构相同的数据，可以采用多种不同的存储方法。", opts: ["对", "错"], ans: 0, tip: "同一逻辑结构可有多种存储实现：如线性表既可以顺序存储，也可以链式存储。" },
      { id: 526, sec: '绪论', tag: '程序与算法', q: "程序不等于算法。", opts: ["对", "错"], ans: 0, tip: "算法必须满足有穷性，而程序（如操作系统服务程序）可以一直运行不终止，因此程序不等于算法。" },
      { id: 527, sec: '绪论', tag: '算法五特性', q: "算法一般应该具有以下5个性质：有穷性、确定性、有效性、输入、输出。", opts: ["对", "错"], ans: 0, tip: "算法五个重要特性：有穷性、确定性、可行性（有效性）、输入、输出，与教材表述一致。" }
    ];
    var DS_CH1 = [
      { id: 531, sec: '第1章', tag: '结构分类辨析', q: "下列关于数据逻辑结构分类的描述中，正确的是（ ）。", opts: ["线性结构中每个元素最多只能有一个前驱和一个后继", "树形结构中每个元素可以有多个前驱元素", "图形结构中必须存在回路", "集合结构中的元素按照某种顺序排列"], ans: 0, tip: "线性结构是一对一关系，每个元素最多一个前驱一个后继；树形只能单前驱多后继；图不必有回路；集合无序。" },
      { id: 532, sec: '第1章', tag: '顺序链式对比', q: "对于顺序存储结构和链式存储结构，下列说法正确的是（ ）。", opts: ["顺序存储结构支持随机访问，链式存储结构只能顺序访问", "顺序存储结构中逻辑上相邻的元素在物理位置上可以不相邻", "链式存储结构中逻辑上相邻的元素在物理位置上也相邻", "链式存储结构不需要额外空间表示元素间的逻辑关系"], ans: 0, tip: "顺序表按序号直接算地址（随机访问），链表只能顺链遍历；A、B恰好说反，链表需要指针域。" },
      { id: 533, sec: '第1章', tag: '嵌套循环复杂度', q: "分析下列算法的时间复杂度： for(int i=1; i<=n; i*=2) { for(int j=1; j<=n; j++) { // 基本操作 } }", opts: ["O(nlogn)", "O(n)", "O(n²)", "O(logn)"], ans: 0, tip: "外层 i 每次乘 2，执行 log₂n 次；内层固定 n 次。总计 n·log₂n，故为 O(nlogn)。" },
      { id: 534, sec: '第1章', tag: '空间复杂度', q: "关于算法空间复杂度的分析，下列说法正确的是（ ）。", opts: ["空间复杂度只考虑算法运行过程中临时占用的存储空间", "空间复杂度包括输入数据所占的空间", "空间复杂度分析需要考虑所有变量占用的空间", "形参所占空间应计入算法的空间复杂度"], ans: 0, tip: "空间复杂度指算法运行中临时占用的辅助空间随规模变化的情况；输入数据空间由问题本身决定，不计入。" },
      { id: 535, sec: '第1章', tag: '渐近比较', q: "假设有两个解决同一问题的算法A和B，算法A的时间复杂度为O(n²)，算法B的时间复杂度为O(nlogn)，则（ ）。", opts: ["当n足够大时，算法B比算法A运行得快", "算法A总是比算法B运行得快", "算法B总是比算法A运行得快", "无法判断哪个算法更好"], ans: 0, tip: "n 足够大时 nlogn 远低于 n²，B 渐近更优；n 较小时受常数因子影响 A 也可能更快，不能说“总是”。" },
      { id: 536, sec: '第1章', tag: '链式特点找错', q: "关于链式存储结构的特点，下列描述错误的是（ ）。", opts: ["存储密度(数据元素所占空间/总空间)比顺序存储结构高", "数据元素可以存放在不连续的存储单元中", "需要用指针域来表示数据元素间的逻辑关系", "插入和删除操作不需要移动大量元素"], ans: 0, tip: "链表结点带指针域，存储密度低于顺序表，C 说反了，是本题要选的错误描述；A、B、D 均正确。" },
      { id: 537, sec: '第1章', tag: '单链表按位查找', q: "在单链表中查找第i个元素的时间复杂度是（ ）。", opts: ["O(n)", "O(1)", "O(i)", "O(logn)"], ans: 0, tip: "单链表不支持随机访问，必须从头沿指针逐个遍历，平均约比较一半结点，与表长 n 成正比，故 O(n)。" },
      { id: 538, sec: '第1章', tag: '四类逻辑结构', q: "根据数据元素之间关系的特点，数据的逻辑结构可以分为四类:____、____、____和____。其中，除____外，其余三种都属于非线性结构。", opts: ["集合、线性结构、树形结构、图形结构；线性结构", "集合、线性结构、树形结构、图形结构；集合", "集合、树形结构、图形结构、线性结构；树形结构", "线性结构、顺序结构、树形结构、图形结构；线性结构"], ans: 0, tip: "四类基本逻辑结构：集合、线性、树形、图形；除线性（一对一）外，其余存在多前驱或多后继，为非线性。" },
      { id: 539, sec: '第1章', tag: '嵌套循环计数', q: "分析下列算法片段：int sum=0; for(int i=1;i<=n;i++){ for(int j=i;j<=n;j++){ sum++; } } 基本操作 sum++ 的执行次数为____，时间复杂度为____。", opts: ["n(n+1)/2；O(n²)", "n(n-1)/2；O(n²)", "n(n+1)/2；O(nlogn)", "n²；O(n)"], ans: 0, tip: "内层次数随 i 递减：n+(n-1)+…+1 = n(n+1)/2；最高阶项 n²/2，故 O(n²)。" },
      { id: 540, sec: '第1章', tag: '顺序表特征填空', q: "顺序存储结构的特点是所有元素存放在地址____的存储单元中，逻辑上相邻的元素物理位置上也____，因此____需要额外空间表示逻辑关系，支持____访问方式。", opts: ["连续；相邻；不；随机", "连续；相邻；需要；随机", "连续；相邻；不；顺序", "离散；相邻；不；随机"], ans: 0, tip: "顺序表用一段地址连续的单元依次存放元素，逻辑关系由物理位置体现，无需额外空间，支持随机访问。注意题干空后有“需要”二字，第三空填“不”。" },
      { id: 541, sec: '第1章', tag: '链式优缺点', q: "链式存储结构的主要优点是____和____操作效率高，主要缺点是不支持____访问，且存储密度____(高于/低于)顺序存储结构。", opts: ["插入；删除；随机；低于", "查找；插入；随机；高于", "插入；删除；直接；低于", "删除；查找；随机；低于"], ans: 0, tip: "链表插删只改指针不用移动元素；但只能顺序访问、结点带指针域，存储密度低于顺序表。" },
      { id: 542, sec: '第1章', tag: '逻辑与存储多对一', q: "同一个逻辑结构可以对应多种存储结构，同样的运算在不同存储结构中的实现方法也可能不同。", opts: ["对", "错"], ans: 0, tip: "如线性表可顺序存储也可链式存储；同为插入运算，顺序表要移动元素而链表只改指针。" },
      { id: 543, sec: '第1章', tag: '复杂度倍增关系', q: "如果一个算法的时间复杂度是O(n²)，那么当输入规模增加一倍时，算法的运行时间也会增加一倍。", opts: ["错", "对"], ans: 0, tip: "规模 n→2n 时，运行时间之比 ≈ (2n)²/n² = 4，即约变为原来的 4 倍，而不是增加一倍。" }
    ];
    var DS_LIST = [
      { id: 551, sec: '线性表', tag: '二维数组列优先地址', q: "二维数组A[10][20]采用列优先方式存储，每个元素占用10个存储单元，且A[0][0]的存储地址是2000，则A[6][12]的地址是____。", opts: ["3260", "3160", "3360", "2260"], ans: 0, tip: "列优先存储按列依次存放：A[6][12]之前有完整的12列（列0~11，每列10个元素共120个），再加上第12列中位于其前的6个元素，合计126个元素。每个元素占10个存储单元，偏移量为126×10=1260，故地址为2000+1260=3260。" },
      { id: 552, sec: '线性表', tag: '带头结点判空', q: "带头结点head的单向链表L判定为空的条件是____。", opts: ["head.next==null", "head==null", "L==null", "head.next==head"], ans: 0, tip: "带头结点的单链表中头结点始终存在，链表为空意味着头结点的指针域为空，即head.next==null（C语言写法head->next==NULL）。注意不能写成head==null，因为空表时头结点依然存在。" },
      { id: 553, sec: '线性表', tag: '线性表逻辑特性', q: "线性表中有且仅有一个开始结点和终端结点，除开始结点和终端结点外，其他每个数据元素有且仅有一个____，有且仅有一个____。", opts: ["直接前驱；直接后继", "直接后继；直接前驱", "前驱；前驱", "后继；后继"], ans: 0, tip: "线性结构中元素之间是一对一的关系：除开始结点没有前驱、终端结点没有后继外，其余每个元素有且仅有一个直接前驱和一个直接后继，这是线性表逻辑特性的体现。" },
      { id: 554, sec: '线性表', tag: '已知结点后插', q: "对于一个具有n个结点的单链表，在已知的结点p后插入一个新结点的时间复杂度为____。", opts: ["O(1)", "O(n)", "O(logn)", "O(n²)"], ans: 0, tip: "在已知结点p后插入只需修改两个指针（s.next=p.next; p.next=s），与表长n无关，为常数阶O(1)。对比：若要在p之前插入或按序号找p，则需从头遍历，为O(n)。" },
      { id: 555, sec: '线性表', tag: '循环链表判尾', q: "对于带头结点head的单向循环链表，如果用p表示当前正在被访问的结点，那么判断到了链表最后一个结点的语句是____。", opts: ["p.next==head", "p.next==null", "p==head", "head.next==p"], ans: 0, tip: "单向循环链表中尾结点的next不再为空，而是指回头结点head，因此p是最后一个结点的判定条件为p.next==head。这是循环链表与普通单链表（判尾条件p.next==null）的关键区别。" },
      { id: 556, sec: '线性表', tag: '顺序表插入移动(0起)', q: "在顺序表中的第i(0≤i≤n-1)个位置之前插入一个新的数据元素，会引起____个数据元素的移动操作。", opts: ["n-i", "n-i+1", "i", "n"], ans: 0, tip: "顺序表元素下标为0到n-1，在第i个位置之前插入时，下标为i到n-1的元素都要依次后移一位，共n-i个元素移动。" },
      { id: 557, sec: '线性表', tag: '顺序表插入移动(1起)', q: "在一个长度为n的顺序表中第i个元素(1<=i<=n)之前插入一个元素时，需向后移动____个元素。", opts: ["n-i+1", "n-i", "i+1", "n+1"], ans: 0, tip: "元素序号为1到n，在第i个元素之前插入时，第i到n个元素都要后移一位，共n-i+1个。注意与上一题的区别：本题位置从1编号，故为n-i+1；上题从0编号，为n-i。" },
      { id: 558, sec: '线性表', tag: '线性表与有序表', q: "以下关于线性表和有序表的叙述中正确的是（ ）。", opts: ["元素和元素之间存在某种关系", "数据和数据之间存在某种关系", "元素内部具有某种结构", "数据项和数据项之间存在某种关系"], ans: 0, tip: "线性表是由数据元素组成的有限序列，其内在联系指元素和元素之间存在的一对一关系；数据项是构成数据元素的不可分割的最小单位，元素内部的构造不属于线性表层面的关系。" },
      { id: 559, sec: '线性表', tag: '双链表前插', q: "在长度为n(n>=1)的双链表L中，在p结点之前插入一个新结点s的时间复杂度是( )。", opts: ["O(1)", "O(n)", "O(n²)", "O(nlogn)"], ans: 0, tip: "双链表的结点同时带有前驱指针prior和后继指针next，在p之前插入s时可直接经p.prior找到前驱，仅修改指针即可完成，时间复杂度为O(1)。若是在单链表中插到p之前，则必须先找前驱，为O(n)。" },
      { id: 560, sec: '线性表', tag: '单链表插结点语句', q: "在一个单链表中的s和t两个结点之间插入一个新的结点p（s在前、t在后），则修改链的Java语句序列是( )。", opts: ["s.next=p; p.next=t", "s.next=p; p.next=s.next", "p.next=t; s.next=p.next", "s.next=p; p.next=t.next"], ans: 0, tip: "s、t相邻且s在前，插入p应使s指向p、p指向t，即s.next=p; p.next=t。A项执行s.next=p后p.next=s.next等价于p指向自己；C项s.next=p.next使p脱链；D项p.next=t.next指向了t的后继，均错误。" },
      { id: 561, sec: '线性表', tag: '链式存储地址要求', q: "线性表若采用链式存储结构时，要求内存中可用存储单元的地址( )。", opts: ["连续不连续都可以", "必须是连续的", "部分地址必须是连续的", "一定是不连续的"], ans: 0, tip: "链式存储靠指针建立元素间的逻辑关系，结点在内存中的位置不受限制，连续或不连续都可以；要求地址连续的是顺序存储结构。" },
      { id: 562, sec: '线性表', tag: '顺序表性质', q: "以下关于顺序表的叙述中正确的是（ ）。", opts: ["顺序表的优点是具有随机存取特性", "顺序表的优点是存储密度大且插入、删除运算的效率高", "顺序表中的所有元素可以连续存放也可以不连续存放", "在含n个元素的顺序表中查找序号为i的元素的时间复杂度为O(n)"], ans: 0, tip: "顺序表按序号可直接计算元素地址，具有随机存取特性，B正确。A错在顺序表插入删除平均要移动一半元素，效率不高；C错在顺序表必须占用连续存储单元；D错在按序号查找是O(1)。" },
      { id: 563, sec: '线性表', tag: '按存取需求选结构', q: "在线性表中，若经常要存取第i个元素及其前驱，则宜采用( )的存储方式。", opts: ["数组", "带头结点的单链表", "不带头结点的单链表", "单向循环链表"], ans: 0, tip: "该需求的核心是随机存取：数组（顺序存储）可在O(1)内定位第i个元素，其前驱即第i-1个元素同样O(1)可得；各种链表定位第i个元素都需从头遍历，为O(n)。" },
      { id: 564, sec: '线性表', tag: '顺序表优点', q: "顺序表具有的优点有( )。", opts: ["可随机存取元素", "便于插入、删除操作", "事先不需要估计存储空间", "比链表优越"], ans: 0, tip: "顺序表的突出优点是可按序号随机存取，存取任一元素都是O(1)。插入、删除恰是顺序表的弱项（A错）；顺序表需要预先分配连续空间（C错）；两种结构各有优劣，不能笼统比较（D错）。" },
      { id: 565, sec: '线性表', tag: '单链表头结点', q: "对于单链表存储结构，以下说法中错误的是（ ）。", opts: ["单链表必须带有头结点", "一个结点的数据成员用于存放线性表中的一个数据元素", "一个结点的指针成员用于指向下一个数据元素的结点", "单链表中的所有结点可以连续存放也可以不连续存放"], ans: 0, tip: "头结点只是为了使空表和非空表处理统一、简化运算而引入的辅助结点，单链表可以不带头结点，故C说法错误，为本题答案；A、B、D均为单链表的正确描述。" },
      { id: 566, sec: '线性表', tag: '链表特点辨析', q: "链表不具备的特点是（ ）。", opts: ["可随机访问任意结点", "插入、删除不需要移动结点", "不必事先估计存储空间", "所需空间与其长度成正比"], ans: 0, tip: "链表结点地址不连续且无序，不能由序号直接计算地址，只能沿指针顺序访问，因此不具备随机访问的特点；B、C、D（动态分配、空间与表长成正比）都是链表具备的特点。" },
      { id: 567, sec: '线性表', tag: '链表读图', q: "对于单链表 head→A→B→C→D→E→∧（E为尾结点，next为空；P1指向结点C，P2指向结点E），下列表达式值为真的是( )。", opts: ["p2.next == null", "head.next.data=='C'", "head.next.data=='B'", "p1.data=='D'"], ans: 0, tip: "head是头结点，head.next指向结点A，故head.next.data为'A'，A、C两项均假；P1指向C，p1.data为'C'，D项假；P2指向尾结点E，其指针域为空，p2.next==null为真，故选B。" },
      { id: 568, sec: '线性表', tag: '数组存储地址要求', q: "线性表若采用数组作为存储结构时，要求内存中可用存储单元的地址( )。", opts: ["必须是连续的", "部分地址必须是连续的", "一定是不连续的", "连续或不连续都可以"], ans: 0, tip: "数组（顺序存储）依靠物理位置的相邻关系体现逻辑关系，任一元素地址可由首地址加偏移计算得出，因此必须占用一段地址连续的存储单元。" },
      { id: 569, sec: '线性表', tag: '平均查找长度', q: "对长度为4的顺序表进行查找，若查找第一个元素的概率为1/24，查找第二个元素的概率为1/6，查找第三个元素的概率为2/3，查找第四个元素的概率为1/8，则查找任意一个元素的平均查找长度为( )。", opts: ["23/8", "20/8", "17/8", "14/8"], ans: 0, tip: "平均查找长度=各元素查找长度×概率之和：1×(1/24)+2×(1/6)+3×(2/3)+4×(1/8)=1/24+1/3+2+1/2=(1+8+48+12)/24=69/24=23/8。" },
      { id: 570, sec: '线性表', tag: '链表结点地址', q: "线性表采用链表存储时，存放所有元素的结点地址（ ）。", opts: ["连续与否均可以", "必须是连续的", "一定是不连续的", "部分地址必须是连续的"], ans: 0, tip: "链表通过指针域维持元素间的逻辑关系，结点在内存中的物理位置完全自由，连续与否均可；这与顺序表形成对照。" },
      { id: 571, sec: '线性表', tag: '线性表定义', q: "线性表是包含n个（ ）的有限序列。", opts: ["数据元素", "关系", "字符", "数据项"], ans: 0, tip: "线性表的定义：n个数据元素的有限序列。数据元素是数据的基本单位，也是线性表的直接组成单位；数据项是元素的组成部分，比元素更小一层。" },
      { id: 572, sec: '线性表', tag: '二维数组地址逆推', q: "二维数组为a[6][10]，每个数组元素占用4个存储单元，使用行优先顺序存放数组元素。若a[3][5]的存储地址为1000，则a[0][0]的存储地址是（ ）。", opts: ["860", "872", "868", "864"], ans: 0, tip: "行优先存储时a[3][5]之前有3整行（3×10=30个）加第3行中的5个元素，共35个元素，偏移量35×4=140。a[0][0]=1000-140=860。" },
      { id: 573, sec: '线性表', tag: '顺序表O(1)操作', q: "在含有n个元素的顺序表中，算法的时间复杂度是O(1)的是（ ）。", opts: ["访问第i个元素(0<=i<=n-1)和求第i个元素(1<=i<=n-1)的前驱元素", "在第i个元素(0<=i<=n-1)后插入一个新元素", "删除第i个元素(0<=i<=n-1)", "将n个元素从小到大排序"], ans: 0, tip: "顺序表支持随机存取，访问第i个元素及求其前驱（下标i-1的元素）都是直接计算地址，O(1)；插入、删除需移动元素O(n)；排序至少O(nlogn)。" },
      { id: 574, sec: '线性表', tag: '随机存取结构', q: "以下数据结构中，可以通过首元素在内存中的存储位置和元素存储空间大小而计算出每一个元素在内存空间存储位置的是( )。", opts: ["数组", "链表", "二叉树", "图"], ans: 0, tip: "数组（顺序存储）中任一元素地址=首元素地址+序号×每元素占用空间，这正是随机存取的原理；链表结点位置任意，树、图结点间为分支/网状关系，均无法计算得出。" },
      { id: 575, sec: '线性表', tag: '链表性质找错', q: "以下关于链表的叙述中不正确的是（ ）。", opts: ["可以根据头结点地址直接计算出第i个结点的地址", "结点中除元素值外还包括指针成员，因此存储密度小于顺序存储结构", "逻辑上相邻的元素物理上不必相邻", "插入、删除运算操作方便，不必移动结点"], ans: 0, tip: "链表结点地址不连续且无序，第i个结点的地址只能沿指针逐个查找获得，无法由头结点地址直接计算，C不正确。A、B、D均为链表的正确特性。" },
      { id: 576, sec: '线性表', tag: '归并最少比较', q: "将两个各有n个元素的递增有序顺序表归并为一个有序顺序表，其最少的比较次数是（ ）。", opts: ["n", "2n-1", "2n", "n-1"], ans: 0, tip: "归并时若一个表的全部元素都不大于另一个表的元素，则比较n次后该表即被取完，另一个表剩余元素直接衔接、不再比较，故最少比较n次；最多情况为2n-1次。" },
      { id: 577, sec: '线性表', tag: '插入平均移动', q: "在有n个结点的顺序表中做插入运算，需平均移动结点的数目为( )。", opts: ["n/2", "n", "(n-1)/2", "(n+1)/2"], ans: 0, tip: "等概率下插入位置共有n+1种，各种位置需移动的元素次数之和为n+(n-1)+…+0=n(n+1)/2，平均移动次数=n(n+1)/2÷(n+1)=n/2，即平均移动表中一半元素。（删除运算的平均移动次数为(n-1)/2，注意区分。）" },
      { id: 578, sec: '线性表', tag: '链式优点', q: "线性表的链式存储结构与顺序存储结构相比，其优点是（ ）。", opts: ["便于插入和删除元素", "所有操作的算法实现简单", "便于随机存取", "节省存储空间"], ans: 0, tip: "链表插入、删除只需修改相关结点的指针，不必移动元素，这是相对顺序表的主要优点；随机存取是顺序表的优点，链表还因指针域多占了存储空间。" },
      { id: 579, sec: '线性表', tag: '合并复杂度', q: "已知两个长度分别为m和n的递增单链表，若将它们合并为一个长度为m+n的递减单链表，则最好情况下的时间复杂度是（ ）。", opts: ["O(m+n)", "O(n)", "O(m)", "O(mn)"], ans: 0, tip: "合并成递减链表需要利用原有的递增性质：逐个比较两表结点并头插到新表中。无论数据如何，两表的全部m+n个结点都必须被处理一遍，最好情况也不例外，故为O(m+n)。" },
      { id: 580, sec: '线性表', tag: 'p后插s', q: "在单链表指针为p的结点之后插入指针为s的结点，正确的操作是：( )。", opts: ["s.next = p.next; p.next = s", "p.next = s; s.next = p.next", "p.next = s; p.next = s.next", "p.next = s.next; p.next = s"], ans: 0, tip: "在p后插入s的顺序是：先让s接上p原来的后继（s.next=p.next），再让p指向s（p.next=s）。顺序不能颠倒，否则p原来的后继地址丢失，链表断裂。" },
      { id: 581, sec: '线性表', tag: '二维数组地址正算', q: "二维数组为a[6][10]，每个数组元素占用4个存储单元。若按照行优先方式存储数组元素，a[0][0]的存储地址为860，则a[3][5]的存储地址是( )。", opts: ["1000", "860", "1140", "1200"], ans: 0, tip: "行优先时a[3][5]之前有3整行×10个加5个，共35个元素，偏移量35×4=140，地址=860+140=1000。（与上一题互为逆运算，可相互验证。）" },
      { id: 582, sec: '线性表', tag: '队列入队复杂度', q: "设长度为n的链式队列采用单循环链表加以表示，若只设一个头指针指向队首元素，则入队操作的时间复杂度是( )。", opts: ["O(n)", "O(1)", "O(logn)", "O(n²)"], ans: 0, tip: "入队是在队尾插入结点。只设指向队首的头指针时，寻找队尾必须从头结点沿循环链遍历整表，需n步，故入队为O(n)。（若改设尾指针，则入队和出队都可O(1)。）" },
      { id: 583, sec: '线性表', tag: '单链表三命题', q: "以下关于单链表的叙述中正确的是（ ）。I. 结点中除元素值外还包括指针成员，存储密度小于顺序表 II. 找第i个结点的时间为O(1) III. 在插入和删除操作时，不必移动结点", opts: ["仅I、III", "仅I、II", "仅II、III", "I、II、III"], ans: 0, tip: "I正确：结点含指针域、占用额外空间，存储密度小于顺序表；II错误：单链表不支持随机存取，找第i个结点需从头遍历，为O(n)；III正确：插删只修改指针不移动结点。故仅I、III正确。" },
      { id: 584, sec: '线性表', tag: '链式存储要求', q: "当数据采用链式存储结构时，要求（ ）。", opts: ["每个结点占用一片连续的存储区域", "所有结点占用一片连续的存储区域", "结点的最后一个数据域是指针类型", "每个节点不论多少个后继只需要一个指针域"], ans: 0, tip: "链式存储要求结点内部（各数据域与指针域）占用一片连续区域，而结点之间可以分散存放；B错误；指针域个数取决于后继（分支）个数，如双链表有两个指针域，C、D错误。" },
      { id: 585, sec: '线性表', tag: '按操作选结构', q: "若某线性表最常用的操作是查找序号为i的元素和在末尾插入元素，则选择（ ）结构最节省时间。", opts: ["顺序表", "带头结点的循环双链表", "单链表", "带尾结点的循环单链表"], ans: 0, tip: "按序号查找要求随机存取能力，只有顺序表能在O(1)内定位第i个元素，且在表尾插入（数据未满时）也无需移动元素；各种链表查找第i个元素都要O(n)，无法满足常用操作的高效要求。" },
      { id: 586, sec: '线性表', tag: '二维数组地址计算', q: "数组A[6][7]的每个元素占用5个字节，将其按照行优先方式存储在起始地址为1000的内存单元中，那么元素A[3][5]的地址是( )。", opts: ["1130", "1180", "1205", "1210"], ans: 0, tip: "行优先时A[3][5]之前有3整行×7个加本行5个，共26个元素，偏移量26×5=130字节，地址=1000+130=1130。注意列数是7而不是其他题的10，不能套用。" },
      { id: 587, sec: '线性表', tag: '删尾O(1)结构', q: "在长度为n的（ ）上，删除尾结点的时间复杂度为O(1)。", opts: ["循环双链表", "单链表", "双向链表", "循环单链表"], ans: 0, tip: "删除尾结点需要同时找到尾结点及其前驱。循环双链表中尾结点可由head.prior直接得到，前驱、后继指针齐全，删除只需修改指针，O(1)完成；单链表找尾O(n)；双向链表（仅头指针）找尾O(n)；循环单链表找尾及其前驱也要O(n)。" },
      { id: 588, sec: '线性表', tag: '尾指针链表操作', q: "有一个长度为n(n>1)的带头结点的单链表，另设有尾指针r（指向尾结点），执行（ ）操作与链表的长度有关。", opts: ["删除单链表中的尾结点", "删除单链表中的首结点", "在单链表的首结点前插入一个新结点", "在单链表的尾结点后插入一个新结点"], ans: 0, tip: "删除尾结点必须先找到其前驱（倒数第二个结点），单链表没有前驱指针，即使知道尾指针r也必须从头遍历，耗时与n有关；A、C都是对首结点的操作，O(1)；D中尾结点r已知，插入O(1)。" },
      { id: 589, sec: '线性表', tag: '有序链表操作', q: "已知一个长度为n的单链表是递增有序的，所有结点的值不相同，以下叙述中正确的是（ ）。", opts: ["找最小值结点的算法的时间复杂度为O(1)", "插入一个结点使之有序的算法的时间复杂度为O(1)", "删除最大值结点的算法的时间复杂度为O(1)", "以上都不对"], ans: 0, tip: "递增有序链表的最小值就是首结点，由head.next直接可得，O(1)。插入结点需先沿链找插入位置，O(n)；最大值结点在表尾，删除它还需找其前驱，同样O(n)。" },
      { id: 590, sec: '线性表', tag: '数组读取复杂度', q: "设一维数组中有n个数组元素，则读取第i个数组元素的平均时间复杂度为( )。", opts: ["O(1)", "O(n)", "O(logn)", "O(n²)"], ans: 0, tip: "数组支持随机存取，读取第i个元素的时间为固定值，与i和n都无关，为O(1)。" },
      { id: 591, sec: '线性表', tag: '顺序表随机存取', q: "在顺序表中取出第i个元素所花费的时间与i成正比。", opts: ["错", "对"], ans: 0, tip: "顺序表支持随机存取，取出第i个元素的时间为O(1)，与i的大小无关。时间与i成正比的是链表按位查找的情形。" },
      { id: 592, sec: '线性表', tag: '链式存储密度', q: "链式存储方式的特点是存储密度大且插入、删除运算效率高。", opts: ["错", "对"], ans: 0, tip: "链式存储的结点除元素本身外还需指针域，存储密度小于顺序存储，说“存储密度大”错误；插入删除效率高这一半是对的，但整个命题因前半句错误而不成立。" },
      { id: 593, sec: '线性表', tag: '顺序表连续性', q: "分配给顺序表的内存单元地址必须是连续的。", opts: ["对", "错"], ans: 0, tip: "顺序表用地址连续的存储单元依次存放元素，靠物理位置相邻体现逻辑关系，这是其随机存取能力的基础，因此分配给它的内存单元地址必须连续。" },
      { id: 594, sec: '线性表', tag: '链表存储方式', q: "链表的数据元素通常被存储在一个数组中。", opts: ["错", "对"], ans: 0, tip: "链表的结点通常在内存中分散存放，靠指针链接表达逻辑关系，不需要也不依赖数组。（静态链表虽借助数组模拟，但通常所说的链表指动态链表。）" }
    ];

    // ===== 答题 =====
    function renderQuestion() {
      var item = run.queue[run.idx];

    // ===== 全真模式：8 分钟总计时，到时强制收卷 =====

    $('sq-btn-again').addEventListener('click', function () {

      var ids = (run.wrongAllTime || loadSaved()).filter(function (id) { return s[id]; });
      var list = ids.map(function (id) { return ALLQ[id]; }).filter(Boolean);
      if (list.length) startDrill(list);
    });
    function goHome() {
      if (run) {
        if (run.cur) {
          if (run.cur.timerId) { clearTimeout(run.cur.timerId); run.cur.timerId = null; }
          if (run.cur.advanceId) { clearTimeout(run.cur.advanceId); run.cur.advanceId = null; }
        }
        if (run.totalTimerId) { clearTimeout(run.totalTimerId); run.totalTimerId = null; }
        run.done = true;
      }
      run = null;
      renderStartButtons();
      show('start');
      window.scrollTo(0, 0);
    }
    $('sq-btn-exit').addEventListener('click', function () {
      if (run && !run.done) {
        if (!window.confirm('确定要退出本次刷题吗？未完成的进度将丢失。')) return;
      }
      goHome();
    });
    $('sq-btn-home').addEventListener('click', goHome);
    window.sqHandleBack = function () {
      if (!screens.start.hidden) return false;
      goHome();
      return true;
    };

    // ===== 错题歼灭：错题连刷，答错重新入队，答对清零 =====
    function startDrill(list) {
      run = {
        mode: 'drill',
        base: list.slice(),
        queue: shuffle(list),
        idx: 0,
        correct: 0,
        wrongIds: [],
        wrongDetail: [],
        drillCleared: [],
        answeredMs: 0,
        answeredCount: 0,
        startAt: Date.now(),
        totalTimerId: null,
        done: false
      };
      show('quiz');
      renderQuestion();
    }

    // ===== 战况统计：薄弱知识点排行，点击专项直刷 =====
    function renderStats() {
      var body = $('sq-stats-body');
      var c = curCfg();
      var sids = subjectIds();
      var tags = {}, totalA = 0, totalC = 0;
      Object.keys(STATS).forEach(function (qid) {
        var q = ALLQ[qid];
        if (!q || !sids[qid]) return;
        var s = STATS[qid];
        totalA += s[0]; totalC += s[1];
        var t = tags[q.tag] || (tags[q.tag] = [0, 0]);
        t[0] += s[0]; t[1] += s[1];
      });
      if (totalA === 0) {
        body.innerHTML = '<div class="text-small sq-subtitle">科目：' + esc(c.name) + '</div><div class="sq-subtitle" style="margin-top:10px;">这门课还没有答题记录——先去刷一轮，回来就能看到薄弱知识点排行。</div>';
        return;
      }
      var pct = Math.round(totalC / totalA * 100);
      var rows = Object.keys(tags).map(function (tag) {
        return { tag: tag, a: tags[tag][0], c: tags[tag][1] };
      }).sort(function (x, y) { return (x.c / x.a) - (y.c / y.a) || y.a - x.a; });
      var html = '<div class="text-small sq-subtitle" style="margin-bottom:8px;">科目：' + esc(c.name) + '</div>' +
        '<div class="sq-stat-top">' +
        '<div class="sq-stat-cell"><div class="text-small sq-subtitle">累计作答</div><div class="sq-stat-val">' + totalA + ' 次</div></div>' +
        '<div class="sq-stat-cell"><div class="text-small sq-subtitle">总正确率</div><div class="sq-stat-val">' + pct + '%</div></div>' +
        '</div>' +
        '<div class="text-small sq-subtitle" style="margin-top:10px;">薄弱在前，点击知识点直接专项刷 · <span style="color:var(--red)">红 &lt;60%</span> / 60–79% / <span style="color:var(--green)">绿 ≥80%</span></div>';
      rows.forEach(function (r, i) {
        var p = Math.round(r.c / r.a * 100);
        var barCls = (p < 60) ? ' sq-bar-weak' : ((p >= 80) ? ' sq-bar-ok' : '');
        html += '<button type="button" class="btn sq-stat-row" data-tag="' + esc(r.tag) + '">' +
          '<span class="sq-stat-rank">' + (i + 1) + '</span>' +
          '<span class="sq-stat-name">' + esc(r.tag) + '</span>' +
          '<span class="progress sq-stat-bar' + barCls + '"><span class="progress-bar" style="width:' + p + '%"></span></span>' +
          '<span class="tabular-nums text-small" style="flex:none; min-width:3em; text-align:right;">' + p + '%</span>' +
          '<span class="text-small sq-subtitle" style="flex:none;">' + r.a + ' 次</span></button>';
      });
      body.innerHTML = html;
      body.querySelectorAll('.sq-stat-row').forEach(function (b) {
        b.addEventListener('click', function () { startTagPractice(b.getAttribute('data-tag')); });
      });
    }
    function startTagPractice(tag) {
      var list = [];
      Object.keys(SUBJECTS).forEach(function (k) {
        var s = SUBJECTS[k];
        if (s.modules) { s.modules.forEach(function (mm) { list = list.concat(mm.bank, mm.variants || []); }); }
        else { list = list.concat(s.bank, s.variants); }
      });
      list = list.filter(function (q) { return q.tag === tag; });
      if (list.length) startRun('practice', list);
    }

    // ===== 背题速览：题干点击展开答案与记忆点，支持搜索 =====
    function renderReview(keyword) {
      var kw = (keyword || '').trim().toLowerCase();
      var bk0 = curBank();
      var all = bk0.bank.concat(bk0.variants);
      var list = all.filter(function (q) {
        if (!kw) return true;
        var hay = (q.q + ' ' + q.tag + ' ' + q.opts[q.ans] + ' ' + q.tip).toLowerCase();
        return hay.indexOf(kw) >= 0;
      });
      var meta = kw ? ('匹配 ' + list.length + ' / ' + all.length + ' 题') : ('共 ' + all.length + ' 题 · 点击题干展开答案');
      var html = '<div class="sq-rev-meta"><span class="text-small sq-subtitle">' + meta + '</span></div>';
      list.forEach(function (q) {
        var num = all.indexOf(q) + 1;
        html += '<details class="sq-rev-item"><summary>' +
          '<span class="sq-rev-chev">▶</span>' +
          '<span class="sq-rev-num">' + num + '</span>' +
          '<span class="sq-rev-q"><span class="sq-chip">' + esc(q.tag) + '</span> ' + esc(q.q) + '</span></summary>' +
          '<div class="sq-rev-body"><div><span class="sq-ok-ico">✓</span> <strong>' + esc(q.opts[q.ans]) + '</strong></div>' +
          '<div class="text-small sq-subtitle" style="margin-top:4px;">' + esc(q.tip) + '</div></div></details>';
      });
      if (!list.length) html += '<div class="sq-subtitle" style="margin-top:8px;">没有匹配的题目，换个关键词试试。</div>';
      $('sq-review-list').innerHTML = html;
    }
    function setReviewOpen(open) {
      $('sq-review-list').querySelectorAll('details').forEach(function (d) { d.open = open; });
    }

    // ===== 键盘 =====
    document.addEventListener('keydown', function (ev) {
      if (!run || screens.quiz.hidden) return;
      var cur = run.cur;
      if (!cur) return;
      var k = ev.key;
      if (!cur.answered) {
        var map = { '1': 0, '2': 1, '3': 2, '4': 3, 'a': 0, 'b': 1, 'c': 2, 'd': 3 };
        var kl = k.toLowerCase();
        if (kl in map) {
          var btns = $('sq-options').querySelectorAll('.sq-optcard');
          if (btns[map[kl]] && !btns[map[kl]].disabled) answer(map[kl]);
          ev.preventDefault();
        }
      } else {
        if (k === 'Enter' || k === ' ') { next(); ev.preventDefault(); }
      }
    });

    renderSubject();
    renderStartButtons();
    show('home');
    window.scrollTo(0, 0);
  })();
  </script>
</div>

<script>
  if ('serviceWorker' in navigator && location.protocol === 'https:') {
    navigator.serviceWorker.register('./sw.js').catch(function () {});
  }
</script>
</body>
